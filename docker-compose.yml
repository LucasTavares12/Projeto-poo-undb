services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: projetopoo
    volumes:
      - db-data:/var/lib/mysql
      - ./server/database/projetopoo_completo.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: projetopoo
      ADMIN_TOKEN_SEGREDO: ${ADMIN_TOKEN_SEGREDO:-segredo-de-desenvolvimento}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8090:80"
    depends_on:
      - server

volumes:
  db-data: